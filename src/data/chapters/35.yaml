  - { id: c35-download-size, label: Download size on the store listing }
  - { id: c35-installed-size, label: "Installed size, app part" }
  - { id: c35-on-demand, label: On-demand resources, options: ["yes", "no", unknown] }
  - { id: c35-storage-trend, label: Storage trend, options: [flat, levels off, keeps growing] }
  - { id: c35-battery-background, label: Background battery use, options: [negligible, explained by a feature, unexplained] }
  - { id: c35-data-day, label: Data used in a day and what was consumed }
  - { id: c35-data-pattern, label: Data pattern, options: [proportionate, more than consumed, notable background share] }
  - { id: c35-scroll, label: Heavy list scroll, options: [smooth with placeholders, stutters on new content, degrades with depth] }
  - { id: c35-return, label: Return after ten minutes away, options: [resumes, restarts and restores, restarts at home] }
  - { id: c35-low-power, label: Low-power mode, options: [adapts, system limits only, no change] }
  - { id: c35-heat, label: Sustained use, options: [cool, warm and adapts, warm and degrades, warm when idle] }
  - { id: c35-posture, label: Posture, options: [1 Unmanaged, 2 Reactive, 3 Budgeted, 4 Adaptive] }
  - { id: c35-trades, label: "Trades observed, such as data spent to save time" }
  - { id: c35-failures, label: Failure modes seen }
