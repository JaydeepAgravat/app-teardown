# One term per concept. Chapters use these terms exactly and do not use synonyms.
# Add a term here before using it in a chapter.
# tooltip: false keeps a very common word out of the hover tooltips.

- title: "Method terms"
  terms:
    - term: "Teardown"
      definition: "The process of working out an app's design from its behavior, and the written result of that process."
    - term: "Probe"
      definition: "A repeatable experiment a normal user can run on an app to expose one aspect of its design."
    - term: "Signal"
      definition: "A behavior observed during a probe or during normal use."
    - term: "Inference"
      definition: "A design claim drawn from one or more signals."
    - term: "Observed"
      definition: "Confidence level. Seen directly in a probe. A fact about behavior."
    - term: "Inferred"
      definition: "Confidence level. The design that best explains the observations, with the alternatives ruled out by a probe."
    - term: "Speculative"
      definition: "Confidence level. Consistent with the observations, but at least one other design fits equally well."
    - term: "Concern"
      definition: "One aspect of system design that applies across app types, such as sync or media."
      tooltip: false
    - term: "Archetype"
      definition: "A generic app type, such as messaging or ride-hailing, defined by its dominant concerns."
    - term: "Worksheet"
      definition: "The standard form a teardown is recorded in."
    - term: "Constraint"
      definition: "A force every mobile app is subject to, such as an unreliable network or process death."

- title: "System terms"
  terms:
    - term: "Client"
      definition: "The app running on the device."
      tooltip: false
    - term: "Backend"
      definition: "Everything the client talks to over the network."
      tooltip: false
    - term: "Local store"
      definition: "Structured data the client keeps on the device and can query."
    - term: "Cache"
      definition: "A copy of data kept to avoid refetching it, which can be discarded without loss."
    - term: "Replica"
      definition: "A copy of data that can be read and written on its own and later converges with other copies. A local store is a replica when the app writes to it first."
    - term: "Source of truth"
      definition: "The copy of a piece of data that wins when copies disagree."
    - term: "Mutation"
      definition: "A single intended change to data, such as \"send this message\" or \"rename this item\"."
    - term: "Optimistic update"
      definition: "Showing the result of a mutation in the UI before the backend has confirmed it."
    - term: "Outbox"
      definition: "A durable, ordered queue of mutations that have been applied locally and not yet confirmed by the backend."
    - term: "Idempotency key"
      definition: "An identifier the client attaches to a mutation so that the backend applies it at most once, however many times it is sent."
    - term: "Reconcile"
      definition: "To replace optimistic local state with the confirmed state from the backend."
    - term: "Rollback"
      definition: "To undo an optimistic update after the backend rejects the mutation."
    - term: "Sync engine"
      definition: "The client component that sends the outbox, pulls remote changes and applies them to the local store."
    - term: "Delta"
      definition: "The set of changes since a known point, as opposed to the full data set."
    - term: "Cursor"
      definition: "An opaque token from the backend that marks a position in a change log or a list."
    - term: "Change log"
      definition: "An ordered record on the backend of every change, which clients read by cursor."
    - term: "Tombstone"
      definition: "A record that an item was deleted, kept so that the deletion can reach other replicas."
    - term: "Backfill"
      definition: "Loading older data after the most recent data is already usable."
    - term: "Conflict"
      definition: "Two replicas changed the same data without having seen each other's change."
    - term: "LWW"
      definition: "Last write wins. A conflict rule in which the later change replaces the earlier one entirely."
    - term: "Push hint"
      definition: "A message from the backend that tells the client that something changed and that it should pull, without carrying the change itself."
    - term: "Process death"
      definition: "The operating system ending the app's process while it is in the background, without notice."
    - term: "Cold start"
      definition: "Launching the app when no process exists for it."
    - term: "Warm start"
      definition: "Returning to an app whose process is still alive."
    - term: "Stale-while-revalidate"
      definition: "Showing cached data at once and refreshing it in the background."
    - term: "Remote config"
      definition: "Values fetched from the backend at run time that change the app's behavior without a new release."
    - term: "Feature flag"
      definition: "A remote config value that turns a feature on or off for a set of users."
    - term: "Server-driven UI"
      definition: "A design in which the backend sends a description of the screen's layout, and not only its data."
    - term: "Fan-out"
      definition: "Delivering one event to many recipients or devices."
    - term: "Session"
      definition: "The period during which the backend accepts a client as a given user without asking for credentials again."
    - term: "Persistent connection"
      definition: "A two-way connection the client and backend keep open, so that either side can send at any time."
    - term: "Platform push"
      definition: "Messages delivered to a device by the operating system's own push service, which reach the device when the app is not running."
    - term: "Silent push"
      definition: "A platform push that shows nothing to the user and asks the operating system to wake the app briefly."

- title: "Method terms, continued"
  terms:
    - term: "Signature"
      definition: "The set of behaviors a design produces that its alternatives do not."
    - term: "Design space"
      definition: "The set of workable designs for one problem."
    - term: "Candidate design"
      definition: "One of the designs that would produce a given signal, listed before any is chosen."
    - term: "Discriminating probe"
      definition: "A probe for which at least two candidate designs predict different outcomes."
    - term: "Inference chain"
      definition: "The four steps from observation to claim. Signal, then candidate designs, then a discriminating probe, then a claim with a confidence word."
    - term: "Confidence word"
      definition: "One of Observed, Inferred or Speculative, attached to every claim."
    - term: "First-pass probe"
      definition: "One of the six probes in Chapter 4 that work on any app and route the reader to the relevant concern chapters."
    - term: "Quick teardown"
      definition: "A teardown of one feature in about 30 minutes, using the first-pass probes only."
    - term: "Full teardown"
      definition: "A teardown of several features that works through each relevant concern chapter."
    - term: "Open question"
      definition: "A design question the teardown did not settle, recorded with its candidate designs and what would settle it."
    - term: "Baseline"
      definition: "A run of a probe's steps without the applied force, for comparison."
      tooltip: false

- title: "The universal app model"
  terms:
    - term: "UI"
      definition: "The client component that draws the screen and takes input."
      tooltip: false
    - term: "Screen state"
      definition: "The data a single screen holds in memory to draw itself, including transient values such as scroll position and typed text."
    - term: "Domain logic"
      definition: "The product's rules, applied on the client or in backend services."
    - term: "Data layer"
      definition: "The client component that decides where each piece of data comes from and gives it to the screens."
    - term: "Network client"
      definition: "The client component that sends every request to the backend and handles sessions, timeouts and retries."
    - term: "Background workers"
      definition: "Client tasks that run while no screen is visible, when the operating system allows."
    - term: "Platform services"
      definition: "Capabilities only the operating system provides, such as notifications, location, secure storage and the store's payment system."
    - term: "Gateway"
      definition: "The backend's single entry point, which checks the session, limits rates and routes requests to services."
    - term: "Services"
      definition: "The backend components that run the backend's share of the domain logic."
      tooltip: false
    - term: "Backend store"
      definition: "The backend storage that holds data which outlives any device."
    - term: "Async delivery"
      definition: "Moving an event to where it is needed without a waiting request, by push, persistent connection or queue."
    - term: "Media delivery"
      definition: "The backend component that stores images, audio, video and files and serves them in several sizes or qualities."
    - term: "Third parties"
      definition: "Systems the app's team does not run, such as payment, identity, maps, analytics and ads."

- title: "Startup and navigation"
  terms:
    - term: "Resume"
      definition: "Returning to an app whose process and screens are both intact, so nothing is rebuilt. The cheapest case of a warm start."
      tooltip: false
    - term: "Splash"
      definition: "The screen shown from launch until the app draws its first real screen."
    - term: "Skeleton"
      definition: "A screen's real layout drawn with placeholders where content will appear."
    - term: "First frame"
      definition: "The first thing the app itself draws after launch."
    - term: "First content"
      definition: "The moment real data is visible after launch."
    - term: "Startup coordinator"
      definition: "The piece of domain logic that decides which screen is shown first."
    - term: "Deferred initialization"
      definition: "Setup that runs after the first frame without being asked for."
    - term: "Lazy initialization"
      definition: "Setup that runs on first use of a feature."
    - term: "Forced-update gate"
      definition: "A screen that replaces the app when its version is below the backend's minimum supported version."
    - term: "Maintenance screen"
      definition: "A screen that replaces the app when the backend states that the service is unavailable."
    - term: "Migration"
      definition: "Converting the local store written by an old version to the shape the new version expects."
    - term: "Navigation state"
      definition: "The tree of selected tab, per-tab stacks and modals that records where the user is."
    - term: "Route"
      definition: "A screen identifier plus its arguments. One entry in navigation state."
      tooltip: false
    - term: "Back stack"
      definition: "The list of screens under the current one, which back pops in order."
    - term: "Synthesized back stack"
      definition: "A back stack the router builds under a link's target, so that back leads to a parent screen."
    - term: "Modal"
      definition: "A screen or stack presented over everything else, with its own way out."
      tooltip: false
    - term: "Router"
      definition: "The client component that turns a link or notification tap into navigation state."
    - term: "State restoration"
      definition: "Rebuilding the user's screen, view state and input after process death."
    - term: "View state"
      definition: "The arrangement of a screen that is not data, such as scroll position or selected segment."
    - term: "Draft"
      definition: "Unfinished input stored as data, keyed by the thing it belongs to."
      tooltip: false
    - term: "Deep link"
      definition: "An address that identifies one screen with its arguments."
    - term: "Custom-scheme link"
      definition: "A deep link in an address scheme private to the app, which works only when the app is installed."
    - term: "Verified web link"
      definition: "An ordinary web address on a domain the app's maker has proven it owns, which the operating system hands to the app when installed."
    - term: "Deferred deep link"
      definition: "A link whose target is remembered through installation and opened on first launch."
    - term: "Link resolver"
      definition: "The backend service that maps a link to a target and records taps for deferred deep links."

- title: "State and API shape"
  terms:
    - term: "Observed query"
      definition: "A query against a store that notifies the screen again whenever its result changes."
    - term: "Shared store"
      definition: "A single client-side copy of each item, keyed by identity, that every screen observes."
    - term: "Derived state"
      definition: "A value computed from other state and not stored itself, such as a badge count or a total."
    - term: "Change event"
      definition: "A notification inside the client that a mutation changed an item, which screens holding a copy listen for."
    - term: "Refetch on appear"
      definition: "Fetching a screen's data again every time the screen becomes visible."
    - term: "Over-fetching"
      definition: "A response that carries more data than the screen uses."
    - term: "Under-fetching"
      definition: "A response that is not enough for the screen, so the client must make further requests."
    - term: "Batching"
      definition: "Sending several logical requests in one round trip."
    - term: "Backend for frontend"
      definition: "A backend layer dedicated to one client, which composes screen-shaped responses from services."
    - term: "Screen-shaped response"
      definition: "A response cut to what one screen or section draws, composed on the backend."
    - term: "Screen-describing response"
      definition: "A response that lists the sections a screen has as well as their data. The entry point to server-driven UI."
    - term: "Query interface"
      definition: "An API in which the client states the fields it needs and the backend returns exactly those."
    - term: "Resource-oriented endpoint"
      definition: "An API endpoint that exposes one kind of backend item, which the client reads, writes and composes with others."
    - term: "Remote procedure call"
      definition: "An API call that names an action and carries its arguments."
    - term: "Partial failure"
      definition: "A response or screen in which some parts succeeded and others did not."

- title: "Storage and caching"
  terms:
    - term: "Read policy"
      definition: "The rule a screen follows when data may exist both locally and on the backend. It sets which copy the screen reads, and in which order."
    - term: "Network only"
      definition: "A read policy in which the screen always fetches and never reads a local copy."
    - term: "Network first"
      definition: "A read policy in which the screen fetches, and reads the cache only if the fetch fails."
    - term: "Cache then network"
      definition: "A read policy in which a cached copy younger than a time limit is shown without a fetch, and otherwise the screen fetches and waits."
    - term: "Cache only"
      definition: "A read policy in which the screen reads local data and never fetches on its own account."
    - term: "Memory cache"
      definition: "A cache held in the process's memory, lost at process death."
    - term: "Disk cache"
      definition: "A cache held in files on the device, which survives process death."
    - term: "Response cache"
      definition: "A cache that stores each response under the request that produced it."
    - term: "Entity cache"
      definition: "A cache that stores each item once, by identity, so every screen reads the same record."
    - term: "Time limit"
      definition: "The maximum age at which a cached entry is used without a refresh."
      tooltip: false
    - term: "Validator"
      definition: "A version tag or modification time the client sends back so the backend can answer that nothing changed, without a body."
    - term: "Invalidation"
      definition: "Marking a cached entry as out of date, on a local write or on a message from the backend."
    - term: "Eviction"
      definition: "Deleting cache entries to stay within a bound."
    - term: "Prefetching"
      definition: "Fetching data before the user asks for it, on a prediction that the user will."
    - term: "Seeding"
      definition: "Starting a detail screen from data the list already held, without a new request."
    - term: "Key-value settings"
      definition: "Small values stored by name and loaded quickly at launch."
    - term: "Secure hardware-backed storage"
      definition: "Storage for small secrets, protected by the device's hardware and unlock state."
    - term: "Metered network"
      definition: "A network on which data use is billed or capped, typically cellular."

- title: "Network"
  terms:
    - term: "Timeout"
      definition: "The client's decision that a request has failed because nothing came back in time."
      tooltip: false
    - term: "Backoff"
      definition: "Lengthening the wait after each failed attempt."
    - term: "Jitter"
      definition: "Randomizing each retry wait so that clients do not retry together."
    - term: "Retry budget"
      definition: "A cap on how many retries a layer or client may issue."
    - term: "Request queue"
      definition: "The network client component that ranks, cancels and merges requests."
    - term: "Cancellation"
      definition: "Dropping a request nobody is waiting for."
      tooltip: false
    - term: "Deduplication"
      definition: "Attaching a second caller to an identical request already in flight."
    - term: "Connection pool"
      definition: "The component that keeps connections open for reuse."
    - term: "Multiplexing"
      definition: "Carrying many requests as separate streams over one connection."
    - term: "Network switch"
      definition: "The device moving from one network to another, such as wireless to cellular, mid-request."
    - term: "Failover"
      definition: "Redirecting requests to another host or region when one fails."
    - term: "Captive network"
      definition: "A network that accepts the device and intercepts its traffic until the user signs in or accepts terms."
    - term: "Data-saver mode"
      definition: "A device setting by which the user asks apps to use less data."

- title: "Real-time delivery"
  terms:
    - term: "Polling"
      definition: "Repeating a request on a timer to find out whether anything changed."
    - term: "Long polling"
      definition: "A request the backend holds open until it has an event to return or a time limit passes, after which the client sends the next one at once."
    - term: "Server stream"
      definition: "One request whose response the backend keeps open and writes events into. Data flows one way, from backend to client."
    - term: "Ephemeral signal"
      definition: "An event that is sent and never stored, such as a typing indicator, and that a disconnected client never learns of."
    - term: "Presence"
      definition: "The backend's knowledge of which users or devices are currently connected."
      tooltip: false
    - term: "Heartbeat"
      definition: "A small periodic message that lets each end of a connection detect that the other end is gone."
    - term: "Acknowledgment"
      definition: "A message sent back along the delivery path to confirm that an event was accepted, stored, delivered or seen."
    - term: "Sequence number"
      definition: "A position the backend assigns to each event in a stream or message in a conversation, used to order items, detect gaps and act as a cursor."
    - term: "Catch-up"
      definition: "Pulling the events missed while disconnected, by cursor from the change log."

- title: "Lists and feeds"
  terms:
    - term: "Offset paging"
      definition: "Asking for a page by a count of items to skip."
    - term: "Cursor paging"
      definition: "Asking for a page by sending back the cursor the backend returned with the previous page."
    - term: "Keyset paging"
      definition: "Asking for a page by sending the sort key of the last item held."
    - term: "Ranked feed"
      definition: "A list whose order the backend computes for one user at one moment, with no stable sort key."
    - term: "Session snapshot"
      definition: "A ranked ordering the backend computes once and stores for a session, so that it can be paged through consistently."
    - term: "Ranking stability"
      definition: "Whether a ranked feed returns the same order when requested again."
    - term: "New-items control"
      definition: "A control that tells the user new items exist and inserts them only when tapped."
    - term: "Silent merge"
      definition: "Inserting new items into a visible list as they arrive, without a user action."
    - term: "Gap"
      definition: "A stretch of a time-ordered list missing between the newest page and the stored items."
      tooltip: false
    - term: "Anchor"
      definition: "The item at which a list is entered when it is not entered at its start."
      tooltip: false
    - term: "Placeholder"
      definition: "A row drawn before its data has arrived."
      tooltip: false
    - term: "View recycling"
      definition: "Reusing a small set of row views for whichever items are currently in sight."

- title: "Messaging"
  terms:
    - term: "Client-generated id"
      definition: "A permanent identifier the client assigns to a new item, which also serves as its idempotency key."
    - term: "Read position"
      definition: "One value per user per conversation holding the highest sequence number that user has seen."
    - term: "End-to-end encryption"
      definition: "A design in which only the participants' devices can read content, and the backend stores and forwards data it cannot read."
    - term: "Backend-readable"
      definition: "The opposite of end-to-end encryption. The backend can read message content."
    - term: "Companion"
      definition: "A device that shows conversations by relaying through the phone and stops when the phone is unreachable."
      tooltip: false
    - term: "Independent devices"
      definition: "A multi-device model in which each device has its own connection, cursor and local store."
    - term: "Fan-out on write"
      definition: "Copying a message to a queue per recipient at send time."
    - term: "Fan-out on read"
      definition: "Recipients reading a shared log by cursor, instead of receiving a copy each."
    - term: "Resumable transfer"
      definition: "An upload or download sent in parts, so that it continues after an interruption instead of restarting."

- title: "Search and personalization"
  terms:
    - term: "Search index"
      definition: "A data structure, derived from the data and kept up to date, that maps words to the items containing them so that a query does not scan every item."
    - term: "Local filter"
      definition: "Searching by scanning rows the client already holds for the typed text, with no index."
    - term: "On-device index"
      definition: "A search index the client builds over its local store."
    - term: "Debouncing"
      definition: "Waiting for a short pause in typing before sending a query."
    - term: "Indexing lag"
      definition: "The time between a write reaching the backend store and the item being findable through the search index."
    - term: "Facet count"
      definition: "The number of results that would remain if a filter value were chosen, computed over the whole matching set."
    - term: "Completion"
      definition: "A proposed ending for the text typed so far, drawn from popular queries."
      tooltip: false
    - term: "Model"
      definition: "A function whose behavior was learned from data instead of written by hand."
      tooltip: false
    - term: "On-device model"
      definition: "A model that runs on the device."
    - term: "Backend model"
      definition: "A model that runs on the backend."
    - term: "Model inputs"
      definition: "The values a model reads when it runs."
    - term: "Model asset"
      definition: "A model file delivered to the device after install and updatable without an app release."
    - term: "Backend profile"
      definition: "The record of a user that personalization reads, kept against the account on the backend."
    - term: "Device profile"
      definition: "The record of a user that personalization reads, kept in one device's local store."
    - term: "Default ranking"
      definition: "What an account with no history is shown."
    - term: "Feedback delay"
      definition: "The time between a user's behavior and its visible effect on a personalized surface."
    - term: "Interaction event"
      definition: "A record of something the user did, uploaded for personalization or analytics."

- title: "Payments, ads and growth"
  terms:
    - term: "Store billing"
      definition: "The store's own payment system, reached through platform services, required for digital goods used in the app."
    - term: "External payment provider"
      definition: "A third party that moves money from the buyer's card or bank to the seller, used for physical goods and services."
    - term: "Receipt"
      definition: "A signed record of a store purchase, which the backend verifies with the store."
      tooltip: false
    - term: "Hosted payment screen"
      definition: "A page the provider serves to collect payment details, so that they never pass through the app's backend."
    - term: "Payment token"
      definition: "A reference that stands in for a card and can be charged only by that seller at that provider."
    - term: "Provider callback"
      definition: "A request the provider sends to the backend to report a payment's outcome."
    - term: "Bank challenge"
      definition: "Extra proof of identity the buyer's bank demands in the middle of a payment."
    - term: "Entitlement"
      definition: "The backend's current answer to what an account may use."
    - term: "Restore purchases"
      definition: "A control that asks the store for the store account's past purchases and runs each through receipt verification."
    - term: "Trial"
      definition: "A free or reduced first period of a subscription."
      tooltip: false
    - term: "Grace period"
      definition: "A limited time after a failed renewal in which the entitlement stays active while the charge is retried."
    - term: "Banner"
      definition: "An ad format. A strip that stays at an edge of the screen."
      tooltip: false
    - term: "Full-screen ad"
      definition: "An ad format. An ad that covers the screen between two actions."
    - term: "Rewarded ad"
      definition: "An ad format. An ad the user chooses to watch in exchange for something in the app."
    - term: "Native ad"
      definition: "An ad format. An ad drawn as an item inside a feed or list."
    - term: "Ad slot"
      definition: "A position in the UI that an ad may occupy."
    - term: "Ad component"
      definition: "The client logic that loads ads, holds them and decides whether one may be shown."
    - term: "Ad source"
      definition: "Any system that can return an ad when asked."
    - term: "Mediation layer"
      definition: "A component that asks several ad sources for the same ad slot and picks one."
    - term: "Fill"
      definition: "The share of ad requests that come back with an ad."
      tooltip: false
    - term: "Frequency limit"
      definition: "A cap on how often a user sees ads."
    - term: "Attribution"
      definition: "Matching an install or later action to the link or ad that caused it."
    - term: "Referral code"
      definition: "An identifier for the inviting user, carried in a link or typed."
    - term: "Contact matching"
      definition: "Uploading identifiers from the device's contacts so that the backend can match them against its accounts."
    - term: "Rating prompt"
      definition: "A request for a store rating, fired by a condition."
    - term: "Re-engagement notification"
      definition: "A notification sent to bring back a user who has stopped opening the app."

- title: "Media"
  terms:
    - term: "Image variant"
      definition: "One version of an image at one size, format and quality, produced by media delivery from the original."
      tooltip: false
    - term: "Stand-in"
      definition: "What an image view draws before its image has arrived."
    - term: "Dominant color"
      definition: "One color value per image, computed at upload and carried in the item data for use as a stand-in."
    - term: "Blurred preview"
      definition: "A very small encoded version of an image, carried in the item data and drawn enlarged until the image arrives."
    - term: "Progressive image"
      definition: "An image file stored as passes of increasing detail, so that the whole picture appears soft and sharpens as bytes arrive."
    - term: "Downsampling"
      definition: "Decoding an image to fewer pixels than the file holds, to match the size it is drawn at."
    - term: "Edge cache"
      definition: "A copy of media kept by media delivery on servers near the user."
    - term: "Start delay"
      definition: "The wait between the tap on play and the first picture or sound."
    - term: "Progressive download"
      definition: "Playing a single file while it is still arriving."
    - term: "Adaptive streaming"
      definition: "Delivering media as segments in several quality levels, with the player choosing a level for each segment."
    - term: "Segment"
      definition: "A piece of media a few seconds long, fetched as one unit."
      tooltip: false
    - term: "Quality level"
      definition: "One encoding of an item at one bitrate and resolution."
    - term: "Manifest"
      definition: "A small document listing an item's quality levels, tracks and segment locations."
    - term: "Buffer"
      definition: "Media already fetched and not yet played."
      tooltip: false
    - term: "Stall"
      definition: "Playback stopping because the buffer emptied."
    - term: "Playback position"
      definition: "The time a user has reached in an item."
    - term: "System media controls"
      definition: "The platform service that shows what is playing and passes lock-screen and headset commands to the app."
    - term: "Picture-in-picture"
      definition: "A small floating video window, drawn by the operating system over other apps."
    - term: "License"
      definition: "A key for protected content, issued by the backend with rules such as an expiry."
      tooltip: false
    - term: "Upload session"
      definition: "A record on the backend of one file in transit, which remembers the parts it holds."
    - term: "Part"
      definition: "One fixed-size piece of a file in a resumable transfer, identified by its position."
      tooltip: false
    - term: "Transfer queue"
      definition: "The durable client store of files in transit, with their progress and conditions."
    - term: "Transfer worker"
      definition: "The background worker that sends or receives files from the transfer queue."
    - term: "Upload, then attach"
      definition: "Sending a file to media delivery first, then sending the mutation that refers to it."
    - term: "Signaling path"
      definition: "The path through the backend that sets up and manages a call."
    - term: "Media path"
      definition: "The route that carries a call's audio and video, separate from signaling."
    - term: "Media engine"
      definition: "The client component that captures, encodes, sends, receives, buffers and plays live media."
    - term: "Relay"
      definition: "A backend server that passes media between two devices without decoding it."
      tooltip: false
    - term: "Media server"
      definition: "A backend server on the media path of a group call."
    - term: "Forwarding server"
      definition: "A media server that forwards each participant's stream without decoding it."
    - term: "Mixing server"
      definition: "A media server that decodes all streams and sends each participant one composed stream."
    - term: "Quality layers"
      definition: "The same video encoded at several qualities at once, so that a forwarding server can choose per receiver."
    - term: "Call push"
      definition: "A high-priority platform push that lets the app present an incoming call when it is not running."
    - term: "Playout buffer"
      definition: "A short receive-side buffer that evens out irregular arrival at the cost of delay."
    - term: "End-to-end delay"
      definition: "The time from an event in front of one device to its appearance on another."
    - term: "Segmented delivery"
      definition: "Live streaming as segments served by media delivery, with a delay of many seconds."
    - term: "Low-latency delivery"
      definition: "Live streaming tuned or built for a delay of a few seconds or less."
    - term: "Live edge"
      definition: "The newest moment of a live stream available to play."

- title: "Quality"
  terms:
    - term: "Crash report"
      definition: "A record of the process's state at the moment it failed, written to the device and uploaded on the next launch."
    - term: "Analytics event"
      definition: "A named action with a timestamp and a few properties, recorded by the client for the team."
    - term: "Event queue"
      definition: "A durable, bounded queue of analytics events awaiting upload, which may drop entries, unlike an outbox."
    - term: "Sampling"
      definition: "Collecting a channel from only a fraction of users, sessions or events."
      tooltip: false
    - term: "Session recording"
      definition: "A record of what a user saw and did, detailed enough to replay."
    - term: "Masking"
      definition: "Replacing sensitive content before a recording or log leaves the device."
    - term: "Consent gate"
      definition: "The client component that drops any event the user has not agreed to."
    - term: "Low-power mode"
      definition: "A device setting by which the user asks the system and apps to use less battery."
    - term: "Main thread"
      definition: "The single thread on which all drawing and input handling happen."
    - term: "On-demand resources"
      definition: "Resources or features left out of the install and downloaded on first use."
    - term: "Download size"
      definition: "What the store transfers when the app is installed."
    - term: "Installed size"
      definition: "What the app occupies on the device once installed."
    - term: "Thermal state"
      definition: "The operating system's report of how hot the device is."
    - term: "Device class"
      definition: "A coarse bucket, such as low, middle or high, that the client assigns to a device."
    - term: "Network class"
      definition: "A coarse bucket for current network quality and cost, taken from measurement."
    - term: "Small variant"
      definition: "A second, smaller app by the same maker for the same product, on the same backend."
    - term: "In-app data saver"
      definition: "A setting inside the app that reduces its data use, distinct from the device's data-saver mode."
    - term: "Adaptation policy"
      definition: "The client logic that turns device class, network class and settings into limits."

- title: "UI technology, reach and modularity"
  terms:
    - term: "Platform toolkit"
      definition: "The operating system's own UI toolkit, used by code written separately for each platform."
    - term: "Mapped toolkit"
      definition: "A cross-platform toolkit that turns one shared screen description into the platform's own controls."
    - term: "Self-drawn toolkit"
      definition: "A cross-platform toolkit that ships its own drawing engine and paints every pixel itself."
    - term: "Embedded web content"
      definition: "A web page shown inside the app, loaded from the network, the app bundle or a cache."
    - term: "Game engine"
      definition: "A runtime that redraws the whole screen as one surface many times a second."
    - term: "Bridge"
      definition: "The narrow set of messages through which web content or a shared-code runtime reaches the host app."
      tooltip: false
    - term: "Seam"
      definition: "A place where the user passes from one drawing path, team or module to another."
    - term: "Screen reader"
      definition: "The system feature that speaks the UI's published structure and lets a user act without seeing the screen."
    - term: "Text scaling"
      definition: "The app's text and layout following the system text size."
    - term: "Reduced motion"
      definition: "A system setting that asks apps to replace large movement with a fade or nothing."
    - term: "Touch target"
      definition: "The tappable area of a control."
    - term: "Right-to-left layout"
      definition: "A layout mirrored for languages read from right to left."
    - term: "Bundled text"
      definition: "Strings shipped inside the app, chosen by device language."
    - term: "Backend text"
      definition: "Strings that arrive in responses, in a language the backend chooses."
    - term: "Feature module"
      definition: "A vertical slice of code holding one feature's UI, screen state and logic."
    - term: "On-demand module"
      definition: "A feature module left out of the installed package and delivered by the store at first use."
    - term: "Design system"
      definition: "A shared module of UI components with their colors, type sizes and spacing."
    - term: "SDK"
      definition: "A library from another company that connects the app to that company's service."
    - term: "Public interface"
      definition: "The entry points a library exposes to its callers."

- title: "Trust"
  terms:
    - term: "Access credential"
      definition: "A short-lived credential sent on every request."
    - term: "Renewal credential"
      definition: "A long-lived credential sent only to obtain a new access credential."
    - term: "Silent renewal"
      definition: "Replacing an expired access credential without the user noticing."
    - term: "One-time code"
      definition: "A short code or link sent to a channel the user controls, valid once."
    - term: "Identity provider"
      definition: "A third party that proves who the user is and returns a signed statement."
    - term: "Device-bound credential"
      definition: "A key pair in secure hardware-backed storage, unlocked by biometrics or passcode, that signs a backend challenge."
    - term: "Second factor"
      definition: "A second sign-in method required after the first."
    - term: "Local gate"
      definition: "An unlock the operating system confirms on the device, which the backend never hears of."
    - term: "Device list"
      definition: "The user-visible list of sessions, one per signed-in device."
    - term: "Revocation"
      definition: "Ending a session from somewhere other than the device that holds it."
    - term: "Guest session"
      definition: "A backend session for an account with no credentials."
    - term: "Client check"
      definition: "Validation on the client for fast feedback, which the backend cannot rely on."
    - term: "Step-up proof"
      definition: "A second proof of identity demanded before a sensitive action."
    - term: "Certificate restriction"
      definition: "The client accepting only its own short list of backend certificates."
    - term: "Rate limit"
      definition: "A cap on how often one party may call an endpoint."
    - term: "System prompt"
      definition: "The permission dialog the operating system draws."
    - term: "Explanation screen"
      definition: "The app's own screen shown before a system prompt."
    - term: "Degraded mode"
      definition: "What a feature does without its permission."
    - term: "System picker"
      definition: "A system screen that returns chosen items without granting library access."
    - term: "Consent record"
      definition: "The stored choice per user and purpose."
    - term: "Privacy listing"
      definition: "The maker's published statement of data collected, shown in the store."

- title: "The device"
  terms:
    - term: "Exit grace period"
      definition: "A short extension the operating system grants an app on leaving the screen, to finish what it is doing."
    - term: "Deferred task"
      definition: "Background work the app registers with conditions and the operating system runs at a time it chooses."
    - term: "User-visible work"
      definition: "Long-running background work the user knows about, which the platform shows with a mandatory indicator."
    - term: "Push wake"
      definition: "A short period of background execution granted to the app when a platform push arrives."
    - term: "System-displayed notification"
      definition: "A notification whose text is in the push payload and is drawn by the operating system with no app code."
    - term: "App-built notification"
      definition: "A notification composed by app code on the device after a push wake."
    - term: "Local notification"
      definition: "A notification the app schedules with the operating system, fired with no backend or network."
    - term: "Replacement key"
      definition: "An identifier that makes a later push or notification replace an earlier one."
    - term: "Expiry"
      definition: "How long the push service keeps trying to deliver a message to an unreachable device."
      tooltip: false
    - term: "Region monitoring"
      definition: "The operating system watching a short list of regions and waking the app on entry or exit."
    - term: "Coarse movement updates"
      definition: "Wakes delivered when the device has moved a significant distance."
    - term: "Surface"
      definition: "A place the app appears outside its own window, run as a separate process."
      tooltip: false
    - term: "Shared storage area"
      definition: "An on-device container that the main app and its surfaces can both read and write."
    - term: "Snapshot"
      definition: "A stored view the system displays for a widget with no app code running."
      tooltip: false
    - term: "Timeline"
      definition: "A list of snapshots with the times each becomes current."
      tooltip: false
    - term: "Live status"
      definition: "A lock-screen view that follows one ongoing activity."
    - term: "Extension"
      definition: "A small program the system loads inside another app's flow for one task."
      tooltip: false

- title: "Change over time"
  terms:
    - term: "Kill switch"
      definition: "A feature flag kept for emergencies, which turns a feature off for everyone."
    - term: "Staged rollout"
      definition: "Releasing a version or a feature to a share of users that is raised step by step."
    - term: "Experiment"
      definition: "A set of variants assigned at random, with measurement of what each group does."
      tooltip: false
    - term: "Experiment variant"
      definition: "One of the behaviors an experiment assigns."
    - term: "Unit of assignment"
      definition: "The thing an experiment randomizes, an account or an installation."
    - term: "Exposure"
      definition: "The event recorded when a user actually meets the place where variants differ."
      tooltip: false
    - term: "Targeting"
      definition: "A rule that decides who gets a config value, by version, device, region or account."
      tooltip: false
    - term: "Shipped defaults"
      definition: "Config values compiled into the app, used when nothing is cached."
    - term: "Component catalog"
      definition: "The set of component types compiled into the app that a described screen may use."
    - term: "Renderer"
      definition: "The client component that turns a screen description into UI."
    - term: "Action handler"
      definition: "The client component that turns backend-described actions into navigation, mutations or reloads."
    - term: "Screen composer"
      definition: "The backend layer that joins a screen definition with data for one client."
    - term: "Minimum supported version"
      definition: "The lowest app version the backend will serve."
    - term: "Soft prompt"
      definition: "A dismissible message that a newer version exists."
    - term: "Release train"
      definition: "Versions that leave on a fixed schedule with whatever is ready."
    - term: "Version negotiation"
      definition: "Client and backend agreeing on a response shape by stated version or capabilities."
    - term: "Non-compiled code"
      definition: "Scripts and assets run by an interpreter in the app, which can be delivered outside the store."

- title: "Archetypes"
  terms:
    - term: "Match server"
      definition: "The backend service that owns the true state of a real-time match and advances it at a fixed rate."
    - term: "Client prediction"
      definition: "The client applying the player's own input at once, before the match server confirms it."
    - term: "Correction"
      definition: "The client replacing its predicted state with the match server's and replaying inputs not yet processed."
      tooltip: false
    - term: "Matchmaking"
      definition: "The backend queue that groups waiting players into a match by skill, delay and size."
    - term: "Live operations"
      definition: "Changing a shipped game on a schedule through config, catalog data and asset packs, with no release."
    - term: "Ledger"
      definition: "A backend record of grants and spends from which a balance is derived."
    - term: "Host app"
      definition: "The app that owns identity, payment, navigation and permissions and runs services inside itself."
    - term: "Mini-program"
      definition: "A package of non-compiled code and assets that the host app downloads and runs in a sandbox."
    - term: "Mini-program runtime"
      definition: "The host app component that interprets and draws a mini-program."
    - term: "Scoped identity"
      definition: "An identifier for a user that is valid for one mini-program only."
    - term: "Wallet"
      definition: "The host app's stored balance and saved payment methods, shared by every service."
      tooltip: false
    - term: "Play queue"
      definition: "The ordered list of items the player will play, together with the index of the current item."
    - term: "Episode feed"
      definition: "A document, published by a show's maker, that lists the show's episodes with the address of each audio file."
    - term: "Host"
      definition: "The participant in a meeting whose role lets them admit, mute and remove others."
      tooltip: false
    - term: "Lobby"
      definition: "The state of a participant who has asked to join a meeting and has not been admitted."
    - term: "Participant list"
      definition: "The backend's record of who is in a call, with each person's role and mute state."
    - term: "Call state"
      definition: "The backend record of one call, holding the participant list, roles, lobby, recording flag and media server."
    - term: "Device binding"
      definition: "Tying an account to registered devices, so that a request from an unknown device needs a stronger proof."
    - term: "Idle timeout"
      definition: "Ending or locking a session after a period without input."
    - term: "Available balance"
      definition: "The balance after amounts reserved for unsettled transactions are subtracted."
    - term: "Booked balance"
      definition: "The balance that counts settled entries only."
    - term: "Risk scoring"
      definition: "A backend judgment of how risky a request is, which sets the proof demanded."
    - term: "Turn"
      definition: "One prompt and its answer in a conversation with an assistant."
      tooltip: false
    - term: "Resumable stream"
      definition: "A server stream whose events carry sequence numbers, so that a client can rejoin after a break."
    - term: "Live audio path"
      definition: "A continuous two-way audio connection between the user and a model."
    - term: "Long-running task"
      definition: "A request the backend runs as a job and announces when finished."
    - term: "Usage limit"
      definition: "A per-account cap on use that the backend counts and enforces."
    - term: "Operation log"
      definition: "The ordered record of every operation applied to one document, from which its state and history are derived."
    - term: "Checkpoint"
      definition: "The full state of a document stored at one revision, so that a client need not replay the whole operation log."
    - term: "Live cursor"
      definition: "The mark showing where another person is typing. An ephemeral signal, unrelated to the sync cursor."
    - term: "Block"
      definition: "One paragraph-sized unit of a document body, with its own id and version."
      tooltip: false
    - term: "Conflicted copy"
      definition: "A second item kept when two replicas changed the same note or file."
    - term: "Accessory"
      definition: "A separate device with sensors and a short-range radio that relays through the phone."
    - term: "Pairing"
      definition: "The one-time exchange that lets an app and an accessory reconnect automatically."
    - term: "Sample"
      definition: "One measurement with the time the sensor recorded it."
      tooltip: false
    - term: "Recording session"
      definition: "The client component that owns an ongoing workout, apart from any screen."
    - term: "Platform health data store"
      definition: "A repository of health data the operating system keeps on the device, shared by apps with consent per data type and direction."
    - term: "Firmware update"
      definition: "A file transfer of new software to an accessory."
    - term: "Cart"
      definition: "The items a buyer has chosen and not yet ordered, stored as item references, options and quantities."
      tooltip: false
    - term: "Guest cart"
      definition: "A cart that belongs to a device or a guest session and not to an account."
    - term: "Cart merge"
      definition: "The rule that joins a guest cart with the account's cart at sign-in."
    - term: "Hold"
      definition: "A short reservation recorded by the backend, with a deadline. It reserves one item for one buyer in a booking flow, or an amount against a balance before a transaction settles."
      tooltip: false
    - term: "Waiting room"
      definition: "A queue in front of a booking flow that admits buyers at a rate the inventory system can handle."
    - term: "Rotating code"
      definition: "A ticket code that changes with time, so that a copy stops working after a short while."
    - term: "Device wallet"
      definition: "The operating system's store for payment cards and passes."
    - term: "Pass"
      definition: "A ticket held in the device wallet, which the backend can update without the app running."
      tooltip: false
    - term: "Story"
      definition: "A short sequence of full-screen items from one account that expires after a fixed time."
      tooltip: false
    - term: "Seen-state"
      definition: "One value per viewer per author holding the newest story item that viewer has seen."
    - term: "Candidate items"
      definition: "The set of items a ranking step gathers and scores for one user."
    - term: "Swipe feed"
      definition: "A ranked feed shown one full-screen item at a time, advanced by a swipe."
    - term: "Preload window"
      definition: "The number of upcoming items, and how much of each, that the client fetches ahead of the current one."
    - term: "Player pool"
      definition: "A small fixed set of prepared players reused as the user moves between items."
    - term: "Poster image"
      definition: "A still frame fetched as an image and drawn where a video will play."
    - term: "Encoding pipeline"
      definition: "The backend process that turns an uploaded video into quality levels, segments and a manifest."
    - term: "Position store"
      definition: "The backend record of playback position per user per item."
    - term: "Trip"
      definition: "The unit of work in an on-demand service. A backend record that moves through states, whether it carries a person or goods."
      tooltip: false
    - term: "Quote"
      definition: "A price the backend issues before a request, with an identity and a time limit, which the confirm request refers to."
      tooltip: false
    - term: "Hold, then capture"
      definition: "Reserving an amount on a payment token at the start and charging the final amount after completion."
    - term: "Relayed number"
      definition: "A phone number from a telephony third party that connects two parties for one trip without revealing either's number."
    - term: "Tile"
      definition: "One square piece of the map at one zoom level, addressed by zoom, column and row."
    - term: "Image tile"
      definition: "A tile delivered as a finished picture."
    - term: "Data tile"
      definition: "A tile delivered as shapes and names that the device draws."
    - term: "Road graph"
      definition: "The junctions, road segments and rules that a router needs."
    - term: "Region package"
      definition: "A file downloaded on purpose that holds map data, and optionally a road graph and a place index, for one area."
    - term: "Platform-provided storage"
      definition: "Storage the platform gives each user under their platform account and syncs between that user's devices, with no backend run by the app's team."
    - term: "Platform account"
      definition: "The user's account with the device platform, as distinct from an account of the app's own."
    - term: "Store account"
      definition: "The account a store purchase belongs to."
    - term: "Device backup"
      definition: "The operating system's backup of a device, which includes app data outside the storage area declared as cache."
    - term: "Local unlock"
      definition: "A purchase state the client decides for itself from a receipt checked on the device, with no backend entitlement."
    - term: "Keep-both resolution"
      definition: "Resolving a conflict by keeping each version as a separate item or marked copy."
    - term: "In-app camera"
      definition: "A camera preview and controls drawn by the app itself."
